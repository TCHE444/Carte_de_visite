<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Business Card</title>

  <style>
    body{
  background-color:rosybrown;
  font-family:Arial,sans-serif;
}
.business-card{
  width:300px;
  padding:20px;
  margin:100px;
  background-color:beige;
  text-align:center;
  font-size:16px;
  margin-left:auto;
  margin-right:auto;
}

.profile-image{
  max-width:100%;
}

p{
  margin:5px;
}
a{
  text-decoration:none;
}
.full-name{
  font-family:Times New Roman,sans-serif;
  color:#1F3A5F;
  font-weight: bold;
}
.designation{
  font-family: Calibri, sans-serif;
  color:#555555;
  
}
.company{
  font-family: Courier, sans-serif;
  font-weight:bold;
}
p{
  font-family: Times New Roman;
  color:#2F4F3A;
}
a{
  font-family: Courier New;
  font-size:18px;
}
  </style>
</head>

<body>
    <div class="business-card">
      <img class="profile-image"
  src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97"
  alt="Developer coding at a desk">
        <p class="full-name">TCHE DEV</p>
        <p class="designation">Front End Web developer</p>
        <p class="company">TCHE_AI</p>
        <hr>
        <p>Email:example.gmail.com</p>
        <p>Tél:456-677-5678</p>
        <a class="portfolio-link"href="#">Portfolio</a>
    <hr>
    <div class="social-media">
        <h2>Connect with me</h2>
        <a href="#">Twitter</a>
        <a href="#">LinkedIn</a>
        <a href="#">GitHub</a>
    </div>
    

</body>

</html>
